<html lang="zh-CN">
<head>
  <meta charset="utf-8">

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #f6f1df;
      color: #151515;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      letter-spacing: 0;
    }

    body {
      overflow-x: hidden;
      user-select: none;
    }

    .app {
      min-height: 100vh;
      padding: 18px 14px 24px;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, .75), rgba(255, 224, 64, .24)),
        #f6f1df;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 0 10px;
      border: 2px solid #151515;
      border-radius: 6px;
      background: #ffdf3f;
      box-shadow: 3px 3px 0 #151515;
      font-size: 13px;
      font-weight: 900;
    }

    h1 {
      margin: 13px 0 0;
      font-size: 34px;
      line-height: 1;
      font-weight: 950;
    }

    .subtitle {
      margin: 8px 0 14px;
      max-width: 360px;
      font-size: 14px;
      line-height: 1.42;
      color: #4f4639;
    }

    .meter {
      display: grid;
      grid-template-columns: 76px 1fr 48px;
      gap: 8px;
      align-items: center;
      margin-bottom: 14px;
      padding: 9px;
      border: 2px solid #151515;
      border-radius: 7px;
      background: #fff;
      box-shadow: 4px 4px 0 #151515;
    }

    .meter span {
      font-size: 13px;
      font-weight: 950;
    }

    .score {
      color: #e5484d;
      text-align: right;
    }

    .track {
      height: 18px;
      overflow: hidden;
      border: 2px solid #151515;
      border-radius: 6px;
      background: repeating-linear-gradient(90deg, #fff 0, #fff 8px, #f3f3f3 8px, #f3f3f3 16px);
    }

    .fill {
      height: 100%;
      width: 0%;
      border-right: 2px solid #151515;
      background: linear-gradient(90deg, #6ee7b7, #ffdf3f, #ff6b6b);
      transition: width .18s ease-out;
    }

    .stage {
      position: relative;
      width: 100%;
      max-width: 520px;
      aspect-ratio: 1 / 1;
      margin: 0 auto;
      overflow: hidden;
      border: 3px solid #151515;
      border-radius: 8px;
      background: #ddd;
      box-shadow: 6px 6px 0 #151515;
      touch-action: none;
    }

    .photo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }

    .grid {
      position: absolute;
      inset: 0;
      opacity: .18;
      background-image:
        linear-gradient(rgba(39, 224, 255, .55) 1px, transparent 1px),
        linear-gradient(90deg, rgba(39, 224, 255, .55) 1px, transparent 1px);
      background-size: 22px 22px;
      pointer-events: none;
    }

    .scan-line {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 4px;
      background: rgba(91, 255, 180, .88);
      box-shadow: 0 0 16px rgba(91, 255, 180, .95);
      pointer-events: none;
      transform: translateY(0);
    }

    .lens-wrap {
      position: absolute;
      left: 42%;
      top: 34%;
      width: 34%;
      aspect-ratio: 1 / 1;
      z-index: 3;
    }

    .lens {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border: 5px solid #151515;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 0 5px #ffdf3f, 8px 9px 0 rgba(0, 0, 0, .36);
    }

    .reveal {
      position: absolute;
      object-fit: cover;
      pointer-events: none;
    }

    .glare {
      position: absolute;
      left: 20%;
      top: 14%;
      width: 36%;
      height: 18%;
      border-radius: 999px;
      background: rgba(255, 255, 255, .44);
      transform: rotate(-28deg);
    }

    .handle {
      position: absolute;
      right: -22px;
      bottom: -34px;
      width: 18px;
      height: 64px;
      border: 4px solid #151515;
      border-radius: 999px;
      background: #ffdf3f;
      transform: rotate(-38deg);
      z-index: -1;
    }

    .bubble {
      position: absolute;
      z-index: 4;
      left: 12px;
      top: 12px;
      max-width: 172px;
      padding: 8px 10px;
      border: 2px solid #151515;
      border-radius: 7px;
      background: #fff;
      box-shadow: 4px 4px 0 #151515;
      font-size: 13px;
      line-height: 1.28;
      font-weight: 900;
      pointer-events: none;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
      max-width: 520px;
      margin: 18px auto 0;
    }

    button {
      min-height: 64px;
      border: 2px solid #151515;
      border-radius: 7px;
      background: #fff;
      box-shadow: 4px 4px 0 #151515;
      color: #151515;
      font: inherit;
      font-weight: 950;
    }

    button:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 #151515;
    }

    .primary {
      background: #ffdf3f;
    }

    .icon {
      display: block;
      margin-bottom: 2px;
      font-size: 20px;
    }

    .ticker {
      max-width: 520px;
      margin: 16px auto 0;
      padding: 10px 12px;
      border: 2px dashed #151515;
      border-radius: 7px;
      background: #e7fff3;
      font-size: 14px;
      line-height: 1.35;
      font-weight: 900;
    }

    .note {
      max-width: 520px;
      margin: 10px auto 0;
      font-size: 12px;
      line-height: 1.4;
      color: #6b6256;
      text-align: center;
    }
  </style>
</head>

        </div>

      </div>

      <div class="bubble" id="bubble">警报：羽绒服封印已松动！</div>
    </section>

    <section class="controls">
      <button class="primary" id="smallBtn"><span class="icon">小</span>小窥模式</button>
      <button id="mediumBtn"><span class="icon">中</span>大饱眼福</button>
      <button id="largeBtn"><span class="icon">大</span>暴力看完</button>
    </section>

    <div class="ticker"><span>系统提示：</span><span id="tip">拖动放大镜，哪里可疑扫哪里。</span></div>
    <div class="note">这是朋友间调侃用的假装扫描玩具，不是真透视。笑可以，别太损。</div>
  </main>

  <script>
    const lines = [
      "警报：羽绒服封印已松动！",
      "检测到隐藏款麒麟臂，建议低调出行。",
      "肌肉含量超标，边检通道请单独排队。",
      "外套：我尽力了，真的遮不住。",
      "扫描结果：朋友群需要重新认识此人。"
    ];

    const tips = [
      "这只是兄弟调侃小玩具，不是真透视。",
      "拖动放大镜，哪里可疑扫哪里。",
      "建议配文：原来你把健身房穿身上了。",
      "肌肉鉴定局提醒：笑可以，别太损。",
      "检测中：外套防御值正在下降。"
    ];

    const stage = document.getElementById("stage");
    const lensWrap = document.getElementById("lensWrap");
    const reveal = document.getElementById("reveal");
    const bubble = document.getElementById("bubble");
    const fill = document.getElementById("fill");
    const score = document.getElementById("score");
    const tip = document.getElementById("tip");
    const scanLine = document.getElementById("scanLine");

    const modeButtons = {
      small: document.getElementById("smallBtn"),
      medium: document.getElementById("mediumBtn"),
      large: document.getElementById("largeBtn")
    };

    let lensScale = 0.12;
    const revealOffsetRatio = { x: 0, y: 0 };
    const muscleZone = { left: 0.37, top: 0.30, right: 0.61, bottom: 0.68 };
    let lensLeft = 0;
    let lensTop = 0;
    let scanY = 0;

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function layout() {
      const rect = stage.getBoundingClientRect();
      const size = Math.round(rect.width * lensScale);
      lensWrap.style.width = `${size}px`;
      lensWrap.style.height = `${size}px`;
      reveal.style.width = `${rect.width}px`;
      reveal.style.height = `${rect.height}px`;
      moveLens(lensLeft || rect.width * 0.42, lensTop || rect.height * 0.34);
    }

    function moveLens(left, top) {
      const rect = stage.getBoundingClientRect();
      const size = lensWrap.offsetWidth;
      lensLeft = clamp(Math.round(left), 0, rect.width - size);
      lensTop = clamp(Math.round(top), 0, rect.height - size);
      lensWrap.style.left = `${lensLeft}px`;
      lensWrap.style.top = `${lensTop}px`;
      reveal.style.left = `${-lensLeft + rect.width * revealOffsetRatio.x}px`;
      reveal.style.top = `${-lensTop + rect.height * revealOffsetRatio.y}px`;

      const bubbleLeft = lensLeft > rect.width * 0.52 ? 12 : rect.width - 188;
      const bubbleTop = lensTop > rect.height * 0.58 ? 12 : rect.height - 82;
      bubble.style.left = `${clamp(bubbleLeft, 12, rect.width - 188)}px`;
      bubble.style.top = `${clamp(bubbleTop, 12, rect.height - 82)}px`;

      const power = calculateMusclePower(rect, lensLeft, lensTop, size);
      score.textContent = `${power}%`;
      fill.style.width = `${power}%`;
      bubble.textContent = lines[Math.floor(Math.random() * lines.length)];
    }

    function handlePointer(event) {
      event.preventDefault();
      const rect = stage.getBoundingClientRect();
      const size = lensWrap.offsetWidth;
      moveLens(event.clientX - rect.left - size / 2, event.clientY - rect.top - size / 2);
    }

    stage.addEventListener("pointerdown", (event) => {
      stage.setPointerCapture(event.pointerId);
      handlePointer(event);
    });

    stage.addEventListener("pointermove", (event) => {
      if (event.buttons || event.pointerType === "touch") handlePointer(event);
    });

    stage.addEventListener("pointerup", () => {
      tip.textContent = tips[Math.floor(Math.random() * tips.length)];
    });

    function setMode(mode) {
      const sizes = { small: 0.12, medium: 0.22, large: 0.43 };
      const texts = {
        small: "小窥模式已开启：偷偷看一眼，礼貌又刺激。",
        medium: "大饱眼福已开启：这下细节比较诚实。",
        large: "暴力看完已开启：外套防线全面失守。"
      };
      lensScale = sizes[mode];
      Object.keys(modeButtons).forEach((key) => {
        modeButtons[key].classList.toggle("primary", key === mode);
      });
      tip.textContent = texts[mode];
      layout();
    }

    modeButtons.small.addEventListener("click", () => setMode("small"));
    modeButtons.medium.addEventListener("click", () => setMode("medium"));
    modeButtons.large.addEventListener("click", () => setMode("large"));

    function calculateMusclePower(rect, x, y, size) {
      const zone = {
        left: rect.width * muscleZone.left,
        top: rect.height * muscleZone.top,
        right: rect.width * muscleZone.right,
        bottom: rect.height * muscleZone.bottom
      };
      const overlapWidth = Math.max(0, Math.min(x + size, zone.right) - Math.max(x, zone.left));
      const overlapHeight = Math.max(0, Math.min(y + size, zone.bottom) - Math.max(y, zone.top));
      const overlapArea = overlapWidth * overlapHeight;
      const lensArea = Math.max(1, size * size);
      const zoneArea = Math.max(1, (zone.right - zone.left) * (zone.bottom - zone.top));
      return clamp(Math.round((overlapArea / Math.min(lensArea, zoneArea)) * 100), 0, 100);
    }

    setInterval(() => {
      const rect = stage.getBoundingClientRect();
      scanY = (scanY + 4) % rect.height;
      scanLine.style.transform = `translateY(${scanY}px)`;
    }, 70);

    window.addEventListener("resize", layout);
    window.addEventListener("load", layout);
  </script>
